services:
  - type: web
    name: sunrise-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Add these later for OneDrive (leave unset for demo mode):
      # TENANT_ID, CLIENT_ID, CLIENT_SECRET, GRAPH_DRIVE_ID, GRAPH_ITEM_ID
