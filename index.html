<title>RMZ Operations Tracker</title>

<style>
/* Layout: sticky command header (logo, clock, weather, upload) over an alert ticker, a scene tab strip with auto-roll progress, one full-width scene, and a safety-tip footer. */
:root{
  --bg:#EEF1F8; --surface:#FFFFFF; --surface2:#F5F7FC; --ink:#131840; --muted:#59628A; --line:#DCE1F0;
  --red:#D3242B; --navy:#27368F; --teal:#0E91A0; --amber:#E39A0B; --violet:#7048C8; --green:#1F9D6B; --pink:#D6457F;
  --good:#17835A; --warn:#B87400; --crit:#C81E26; --info:#2461D6;
  --good-bg:#E0F4EB; --warn-bg:#FFF1D2; --crit-bg:#FDE4E5; --info-bg:#E3ECFD;
  --head:#27368F; --head-ink:#FFFFFF; --shadow:0 1px 2px rgba(19,24,64,.06),0 4px 14px rgba(19,24,64,.06);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1030; --surface:#151B45; --surface2:#1B2252; --ink:#EEF1FF; --muted:#A3ACD6; --line:#2B3470;
  --red:#FF5A5F; --navy:#8FA2FF; --teal:#38C6D4; --amber:#FFC23D; --violet:#A98BFF; --green:#3DD598; --pink:#FF7BAE;
  --good:#3DD598; --warn:#FFC23D; --crit:#FF6B70; --info:#7BA5FF;
  --good-bg:#12372E; --warn-bg:#3D3112; --crit-bg:#431A25; --info-bg:#1B2C5E;
  --head:#10164A; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1030; --surface:#151B45; --surface2:#1B2252; --ink:#EEF1FF; --muted:#A3ACD6; --line:#2B3470;
  --red:#FF5A5F; --navy:#8FA2FF; --teal:#38C6D4; --amber:#FFC23D; --violet:#A98BFF; --green:#3DD598; --pink:#FF7BAE;
  --good:#3DD598; --warn:#FFC23D; --crit:#FF6B70; --info:#7BA5FF;
  --good-bg:#12372E; --warn-bg:#3D3112; --crit-bg:#431A25; --info-bg:#1B2C5E;
  --head:#10164A; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.num,.mono{font-variant-numeric:tabular-nums}
.wrap{max-width:1920px;margin:0 auto}

/* header */
.top{background:var(--head);color:var(--head-ink);border-radius:0 0 18px 18px;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));
  padding:14px max(16px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center;position:relative}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--red) 0 34%,#fff 34% 36%,#3F57D8 36% 100%);border-radius:0 0 18px 18px;opacity:.95}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.logo{background:#fff;border-radius:12px;padding:4px 12px;height:72px;display:flex;align-items:center}
.logo img{height:64px;width:auto;display:block}
.brand h1{margin:0;font-size:clamp(18px,2vw,28px);font-weight:800;letter-spacing:-.01em;line-height:1.1}
.brand p{margin:3px 0 0;font-size:13px;opacity:.8}
.clock{margin-left:auto;text-align:center}
.clock .t{font-family:var(--mono);font-weight:700;font-size:clamp(28px,3.4vw,50px);letter-spacing:-.02em;line-height:1}
.clock .d{font-size:13px;opacity:.85;margin-top:4px}
.wx{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:8px 14px;min-width:0}
.wx svg{width:44px;height:44px;flex:none}
.wx .big{font-size:30px;font-weight:800;line-height:1}
.wx .meta{font-size:12px;opacity:.85;line-height:1.35}
.wx .days{display:flex;gap:10px;border-left:1px solid rgba(255,255,255,.2);padding-left:14px}
.wx .day{text-align:center;font-size:11px;min-width:42px}
.wx .day svg{width:22px;height:22px;display:block;margin:2px auto}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:#fff;color:#27368F;border:0;border-radius:10px;padding:9px 14px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:7px}
.btn.ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25)}
.btn svg{width:16px;height:16px}
.badge{background:var(--red);color:#fff;border-radius:99px;padding:0 7px;font-size:11px;min-width:20px;text-align:center;line-height:18px}

.wx:empty{display:none}
.kpi.on{outline:3px solid var(--tone);outline-offset:2px}
.alertpop{position:fixed;inset:0;background:rgba(19,24,64,.8);display:flex;align-items:center;justify-content:center;z-index:80;padding:24px}
.alertpop[hidden]{display:none}
.alertpop .box{background:var(--surface);color:var(--ink);border:5px solid var(--crit);border-radius:20px;max-width:960px;width:100%;padding:30px 38px;box-shadow:0 24px 70px rgba(0,0,0,.55)}
.alertpop h2{margin:0 0 8px;color:var(--crit);font-size:34px;letter-spacing:.14em;font-weight:800}
.alertpop ul{list-style:none;margin:0;padding:0}
.alertpop li{font-size:30px;font-weight:800;margin:14px 0;line-height:1.25}
.alertpop li small{display:block;font-size:17px;color:var(--muted);font-weight:600;margin-top:2px}
.alertpop .btn{margin-top:12px;font-size:18px;padding:10px 28px}
/* ticker */
.ticker{margin:14px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;align-items:stretch;overflow:hidden;box-shadow:var(--shadow)}
.ticker .lbl{background:var(--red);color:#fff;font-weight:800;font-size:12px;letter-spacing:.08em;padding:10px 14px;display:flex;align-items:center;gap:8px;text-transform:uppercase;flex:none}
.ticker .roll{overflow:hidden;flex:1;min-width:0;position:relative}
.ticker .track{display:inline-flex;white-space:nowrap;animation:roll var(--dur,60s) linear infinite;padding:9px 0}
.ticker:hover .track{animation-play-state:paused}
@keyframes roll{to{transform:translateX(-50%)}}
.tk{display:inline-flex;align-items:center;gap:8px;padding:0 26px;font-weight:600;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.crit{background:var(--crit);box-shadow:0 0 0 4px var(--crit-bg)}.dot.warn{background:var(--amber);box-shadow:0 0 0 4px var(--warn-bg)}.dot.info{background:var(--info);box-shadow:0 0 0 4px var(--info-bg)}.dot.good{background:var(--good)}

.wxbanner{margin-top:12px;border-radius:12px;padding:12px 16px;background:var(--crit-bg);color:var(--crit);border:2px solid var(--crit);font-weight:700;display:flex;gap:12px;align-items:center;animation:pulse 1.6s ease-in-out infinite}
.wxbanner.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--amber)}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--crit-bg)}}

/* tabs */
.tabs{display:flex;gap:6px;margin:14px 0 0;overflow-x:auto;padding-bottom:2px;align-items:stretch}
.tab{position:relative;flex:1 0 auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:9px;overflow:hidden;white-space:nowrap}
.tab i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.tab[aria-selected=true]{background:var(--c);color:#fff;border-color:var(--c)}
.tab[aria-selected=true] i{background:#fff}
.tab .prog{position:absolute;left:0;bottom:0;height:4px;background:rgba(255,255,255,.75);width:0}
.tab[aria-selected=true] .prog.run{animation:prog var(--roll,20s) linear forwards}
@keyframes prog{to{width:100%}}
.ctl{flex:none;width:44px;justify-content:center;padding:0}

/* scene */
.scene{margin-top:14px;display:grid;gap:14px;animation:fade .35s ease}
@keyframes fade{from{opacity:.0;transform:translateY(6px)}}
.sh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sh h2{margin:0;font-size:22px;font-weight:800;color:var(--c)}
.sh span{color:var(--muted);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);text-align:left;position:relative;overflow:hidden;min-width:0}
.kpi::before{content:"";position:absolute;inset:0 auto 0 0;width:0}
.kpi .k{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-size:clamp(28px,3vw,42px);font-weight:800;line-height:1.1;margin-top:4px;color:var(--tone,var(--ink))}
.kpi .s{font-size:12.5px;color:var(--muted);margin-top:2px}
button.kpi:hover{transform:translateY(-2px);border-color:var(--tone,var(--navy))}
.kpi.t-red{--tone:var(--red)}.kpi.t-navy{--tone:var(--navy)}.kpi.t-teal{--tone:var(--teal)}.kpi.t-amber{--tone:var(--amber)}.kpi.t-violet{--tone:var(--violet)}.kpi.t-green{--tone:var(--green)}.kpi.t-pink{--tone:var(--pink)}
.kpi.fill{background:var(--tone);border-color:var(--tone)}.kpi.fill .k,.kpi.fill .s{color:rgba(255,255,255,.85)}.kpi.fill .v{color:#fff}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.grid.wide{grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 12px;font-size:14px;font-weight:800;display:flex;justify-content:space-between;gap:8px;align-items:center}
.card h3 small{font-weight:600;color:var(--muted);font-size:12px}
.hint{color:var(--muted);font-size:12px}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(80px,32%) 1fr 44px;gap:10px;align-items:center;font-size:13px;background:none;border:0;padding:2px 0;text-align:left;width:100%}
.bar .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bar .tr{height:16px;background:var(--surface2);border-radius:8px;overflow:hidden}
.bar .fl{height:100%;border-radius:4px 8px 8px 4px;background:var(--c);min-width:3px;transition:width .6s}
.bar .c{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
button.bar:hover .n{text-decoration:underline}
.bar.on{outline:2px solid var(--c);outline-offset:2px;border-radius:6px}
.donutwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donutwrap svg{width:170px;height:170px;flex:none}
.leg{display:grid;gap:6px;font-size:13px;min-width:0;flex:1}
.leg button{display:flex;gap:8px;align-items:center;background:none;border:0;padding:2px 0;text-align:left}
.leg i{width:11px;height:11px;border-radius:3px;background:var(--c);flex:none}
.leg b{margin-left:auto;padding-left:10px;font-variant-numeric:tabular-nums}
.leg button.on{font-weight:800}
.tblwrap{overflow:auto;max-height:var(--mh,360px);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--surface2);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:9px 10px;white-space:nowrap;z-index:1}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
tr:hover td{background:var(--surface2)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:11.5px;font-weight:800;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.crit{background:var(--crit-bg);color:var(--crit)}.pill.info{background:var(--info-bg);color:var(--info)}.pill.mute{background:var(--surface2);color:var(--muted)}
.filt{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap;font-size:12px}
.chip{background:var(--info-bg);color:var(--info);border:0;border-radius:99px;padding:3px 10px;font-weight:800;font-size:12px}
input.search{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;min-width:200px;max-width:100%}
.prog2{height:12px;background:var(--surface2);border-radius:7px;overflow:hidden}.prog2>div{height:100%;background:var(--c);border-radius:7px}
.row2{display:grid;grid-template-columns:minmax(90px,28%) 1fr 52px;gap:10px;align-items:center;font-size:13px;padding:4px 0}
.row2 .n small{display:block;color:var(--muted);font-size:11px}
.attn{display:grid;gap:8px;max-height:340px;overflow:auto}
.attn button{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600}
.attn .dot{margin-top:5px}
.tip{background:linear-gradient(135deg,var(--navy),var(--teal));color:#fff;border-radius:14px;padding:18px 22px;font-size:clamp(18px,2vw,28px);font-weight:700;line-height:1.3}
.tip small{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.8;margin-bottom:6px}
.empty{padding:30px;text-align:center;color:var(--muted)}
.foot{margin:16px 0 22px;display:flex;gap:14px 24px;flex-wrap:wrap;align-items:center;justify-content:space-between;color:var(--muted);font-size:12.5px}
.foot .tipbar{flex:1 1 420px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--green);border-radius:10px;padding:10px 14px;color:var(--ink);font-weight:600;font-size:14px}
.foot .tipbar b{color:var(--green);text-transform:uppercase;font-size:11px;letter-spacing:.1em;margin-right:8px}
.drop{position:fixed;inset:0;background:rgba(39,54,143,.88);color:#fff;display:none;align-items:center;justify-content:center;font-size:28px;font-weight:800;z-index:50;text-align:center;padding:20px}
.drop.on{display:flex}
.panel{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:90px;width:min(440px,calc(100% - 32px));max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.3);padding:14px;z-index:40}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:700;z-index:60;max-width:90%}
#tipx{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:12px;font-weight:600;z-index:70;display:none;max-width:260px}
.colchart{width:100%;height:auto;display:block}
.colchart text{fill:var(--muted);font-size:10px;font-family:var(--font)}
.colchart rect.b{fill:var(--c);cursor:default}
.colchart rect.b:hover{opacity:.75}
@media (max-width:760px){.clock{margin-left:0;text-align:left}.wx .days{display:none}}

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TZ='Asia/Kolkata', ROLL=20000;
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const isTV=()=>document.documentElement.classList.contains('tv');
function wantTV(){let p=null;try{p=localStorage.getItem('tv')}catch(e){}if(p==='1')return true;if(p==='0')return false;return innerWidth>=1500&&innerWidth/innerHeight>1.5}
function fit(){const w=$('.wrap');if(!isTV()){w.style.transform='';return}const z=Math.min(innerWidth/1920,innerHeight/1080);w.style.transform=`translate(${(innerWidth-1920*z)/2}px,${(innerHeight-1080*z)/2}px) scale(${z})`}
function setTV(on,save){document.documentElement.classList.toggle('tv',on);if(save){try{localStorage.setItem('tv',on?'1':'0')}catch(e){}}fit();renderScene(true)}
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---------- dates & numbers ---------- */
const todayISO=()=>new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(new Date());
const isISO=v=>typeof v==='string'&&/^\d{4}-\d{2}-\d{2}/.test(v);
const dayN=iso=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso||'');return m?Date.UTC(+m[1],+m[2]-1,+m[3])/864e5:NaN};
const diff=(a,b)=>dayN(a)-dayN(b);
const fd=iso=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso||'');return m?`${+m[3]} ${MON[+m[2]-1]} ${m[1]}`:(iso||'')};
const fds=iso=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso||'');return m?`${+m[3]} ${MON[+m[2]-1]}`:''};
const num=v=>{if(typeof v==='number')return v;const n=parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n};
const inr=n=>n>=1e7?'₹'+(n/1e7).toFixed(2)+' Cr':n>=1e5?'₹'+(n/1e5).toFixed(1)+' L':'₹'+Math.round(n).toLocaleString('en-IN');
const pct=v=>{const n=num(v);return Math.round(n<=1?n*100:n)};
const cnt=(arr,fn)=>{const m=new Map();arr.forEach(x=>{const k=fn(x);m.set(k,(m.get(k)||0)+1)});return [...m].map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v)};
const dateTime=s=>{const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4}),?\s*(\d{1,2}):(\d{2})(?::\d{2})?\s*(am|pm)?/i.exec(String(s||''));if(m){let h=+m[4];if(m[6]){const pm=/pm/i.test(m[6]);if(pm&&h<12)h+=12;if(!pm&&h===12)h=0}return{iso:`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`,t:String(h).padStart(2,'0')+':'+m[5]}};return isISO(s)?{iso:String(s).slice(0,10),t:''}:null};

/* ---------- workbook -> tidy tables ---------- */
const IPR_KEEP=['IPR Reference','IPR Date','Department','Requester','Item Description','Vendor Name','IPR Amount (Excluding GST)','Status','IPR Approved Amount','PO Number','PO & IPR Status','PO Status','Budget Head','Payment Date','Amount Paid'];
function tbl(aoa){
  if(!aoa||!aoa.length)return[];
  const hi=aoa.findIndex(r=>r.filter(c=>c!=null&&c!=='').length>=2); if(hi<0)return[];
  const h=aoa[hi].map(c=>c==null?'':String(c).replace(/\s+/g,' ').trim()), seen={}, keys=h.map(k=>{if(!k)return'';seen[k]=(seen[k]||0)+1;return seen[k]>1?k+' '+seen[k]:k});
  const out=[];
  for(let i=hi+1;i<aoa.length;i++){const r=aoa[i];if(!r||!r.some(c=>c!=null&&c!==''))continue;const o={};keys.forEach((k,j)=>{if(k)o[k]=r[j]==null?'':r[j]});out.push(o)}
  return out;
}
const pick=(raw,prefix)=>{const k=Object.keys(raw).find(n=>n.trim().toLowerCase().startsWith(prefix));return k?raw[k]:[]};
const g=(o,p)=>{const k=Object.keys(o).find(k=>k.toLowerCase().startsWith(p.toLowerCase()));return k?o[k]:''};
const deptN=s=>{const t=String(s||'').replace(/\s+/g,'').toUpperCase();return t||'Not set'};
const stN=s=>{const t=String(s||'').trim();return t?t[0].toUpperCase()+t.slice(1).toLowerCase():'Not set'};

function build(raw){
  const D={};
  D.tasks=tbl(pick(raw,'tasks')).filter(r=>String(r.Task||'').trim()).map(r=>({id:r.ID,task:String(r.Task).trim(),owner:String(r.Owner||'').trim()||'Unassigned',pri:String(r.Priority||'').trim(),st:String(r.Status||'').trim(),due:isISO(r['Due Date'])?r['Due Date'].slice(0,10):'',done:isISO(r['Completed Date'])?r['Completed Date'].slice(0,10):''}));
  D.alerts=tbl(pick(raw,'alerts')).map(r=>({date:[r['Alert Date'],r['Alert Time']].find(isISO)||'',text:String(r.Alert||'').trim(),pri:String(r.Priority||'').trim(),st:String(r.Status||'').trim()})).filter(a=>a.text);
  D.complaints=tbl(pick(raw,'complaints')).map(r=>({no:r.Ticket,date:isISO(r.Date)?r.Date.slice(0,10):'',dept:String(r.Department||'').trim(),text:String(r.Complaint||'').trim(),to:String(r['Assigned To']||'').trim(),pri:String(r.Priority||'').trim(),st:String(r.Status||'').trim()})).filter(r=>r.text);
  D.events=tbl(pick(raw,'events')).map(r=>({name:String(r.Event||'').trim(),from:isISO(r['Date from'])?r['Date from'].slice(0,10):'',to:isISO(r['Date To'])?r['Date To'].slice(0,10):'',venue:String(r.Venue||'').trim(),owner:String(r.Owner||'').trim(),prep:pct(r['Preparation %']),st:String(r.Status||'').trim()})).filter(r=>r.name);
  D.tips=tbl(pick(raw,'safetytips')).map(r=>({date:isISO(r.Date)?r.Date.slice(0,10):'',tip:String(r.Tip||'').trim()})).filter(r=>r.tip);
  D.permits=tbl(pick(raw,'work permits')).map(r=>{const d=dateTime(r.Date);return{sl:r['Sl No'],iso:d?d.iso:'',t:d?d.t:'',type:String(r['Permit Type']||'').trim(),st:String(r.Status||'').trim()}}).filter(r=>r.iso&&isNaN(+r.type)&&r.type);
  D.bd=tbl(pick(raw,'breakdown')).map(r=>({sl:r.SL,occ:isISO(r['Date of occurrence'])?r['Date of occurrence'].slice(0,10):'',tgt:isISO(r['Tentative Target Date'])?r['Tentative Target Date'].slice(0,10):'',cat:String(r.Category||'').trim().toUpperCase()||'OTHER',eq:String(r['Equipment/System']||'').trim(),issue:String(r['Major issues']||'').trim(),st:String(r.Status||'').trim()})).filter(r=>r.eq||r.issue);
  D.parking=tbl(pick(raw,'paid parking')).filter(r=>isISO(r.DATE)).map(r=>({iso:r.DATE.slice(0,10),w2:num(r['No.of 2W']),a2:num(r.Amount),w4:num(r['No.of 4W']),a4:num(r['Amount 2']),wr:num(r['No.of 2W Wrong parking'])+num(r['No.of 4W Wrong parking']),tot:num(g(r,'System'))||num(r.Amount)+num(r['Amount 2'])}));
  D.incidents=tbl(pick(raw,'incidents')).filter(r=>isISO(r.DATE)).map(r=>({iso:r.DATE.slice(0,10),text:String(r.Incident||'').trim()}));

function computeAlerts(){

    A.push({pop:d!=null&&d<=0,id:a.date+'|'+a.text,raw:a.text,when:a.date?(late?`Overdue since ${fd(a.date)}`:d===0?'Due today':`Due ${fd(a.date)}`):'',sev:/high/i.test(a.pri)?'crit':'warn',text:`${a.text}${a.date?(late?` · overdue since ${fd(a.date)}`:d===0?' · due today':` · due ${fd(a.date)}`):''}`,go:1})});
  const od=D.tasks.filter(x=>x.st!=='Completed'&&x.due&&x.due<t);
  if(od.length)A.push({sev:od.some(x=>/high/i.test(x.pri))?'crit':'warn',text:`${od.length} tasks overdue (${od.filter(x=>/high/i.test(x.pri)).length} high priority)`,go:1});
  const bo=D.bd.filter(x=>!/clos|done|complet/i.test(x.st)&&x.tgt&&x.tgt<t);

  D.comp.forEach(c=>{if(!c.exp)return;const d=diff(c.exp,t);if(d<=60)A.push({sev:d<=30?'crit':'warn',text:`${c.doc} expires ${d<0?'(expired) ':'in '+d+' days · '}${fd(c.exp)} · ${c.st||'status not set'}`,go:5})});
  D.events.forEach(e=>{if(!e.from)return;const d=diff(e.from,t);if(d>=0&&d<=14)A.push({sev:'info',text:`Upcoming: ${e.name} on ${fds(e.from)} (${d===0?'today':'in '+d+' days'})`,go:5})});
  const pa=D.ipr.filter(x=>x.awaited); if(pa.length)A.push({sev:'warn',text:`${pa.length} IPRs waiting for a PO number (${inr(pa.reduce((x,y)=>x+y.amt,0))})`,go:4});

  return A;
}

/* ---------- render / roll ---------- */
function renderTabs(){
  $('#tabs').innerHTML=SCENES.map((s,i)=>`<button class="tab" role="tab" style="--c:var(${s.c})" aria-selected="${i===S.scene}" data-tab="${i}"><i></i>${esc(s.name)}<span class="prog ${!S.paused&&i===S.scene&&!s.manual?'run':''}"></span></button>`).join('')+`<button class="tab ctl" id="pp" title="${S.paused?'Resume':'Pause'} auto-roll" aria-label="${S.paused?'Resume':'Pause'} auto-roll">${S.paused?'▶':'❚❚'}</button>`;

function renderScene(keepScroll){
  const sc=SCENES[S.scene],el=$('#scene');el.style.setProperty('--c',`var(${sc.c})`);
  const st=(document.scrollingElement||document.documentElement).scrollTop;
  try{el.innerHTML=sc.render()}catch(e){console.error(e);el.innerHTML='<div class="card empty">This section could not be drawn from the current data.</div>'}

let lastVer='';
async function loadData(){
  try{
    const c=new AbortController(),to=setTimeout(()=>c.abort(),45000);
    const r=await fetch('/api/raw',{cache:'no-store',signal:c.signal});clearTimeout(to);
    const j=await r.json();
    S.err=j.error||'';
    const label=`${SRC[j.source]||j.source||'Live'} · checked ${hhmm()}`;
    if(j.raw&&Object.keys(j.raw).length&&j.version!==lastVer){lastVer=j.version;apply(j.raw,label,Date.now())}
    else{S.src=label;S.loading=false;if(!Object.keys(S.raw).length)renderScene(true);renderFresh()}
  }catch(e){S.err='Cannot reach the server - showing the last data';S.loading=false;if(!Object.keys(S.raw).length)renderScene(true);renderFresh()}
}

function showPop(list){
  let seen={};try{seen=JSON.parse(localStorage.getItem('seenAlerts')||'{}')}catch(e){}
  const fresh=list.filter(a=>!seen[a.id]);if(!fresh.length)return;
  fresh.forEach(a=>{seen[a.id]=Date.now()});try{localStorage.setItem('seenAlerts',JSON.stringify(seen))}catch(e){}
  const p=$('#alertpop');
  p.innerHTML=`<div class="box" role="alertdialog"><h2>⚠ ALERT</h2><ul>${fresh.slice(0,5).map(a=>`<li>${esc(a.raw)}<small>${esc(a.when)}</small></li>`).join('')}</ul><button class="btn" data-closepop="1">OK</button></div>`;

}

  if(t.dataset.go!=null&&t.dataset.go!=='')return go(+t.dataset.go,true);
  if(t.dataset.f){S.pauseUntil=Date.now()+60000;const k=t.dataset.f,v=t.dataset.v;S.f[k]=S.f[k]&&S.f[k].v===v?undefined:{v};if(!S.f[k])delete S.f[k];return renderScene(true)}
  if(t.dataset.clear){delete S.f[t.dataset.clear];return renderScene(true)}
  if(t.dataset.sheet){S.sheetTab=t.dataset.sheet;S.q='';return renderScene(true)}
  if(t.dataset.alert!=null){const a=S.alertsList[+t.dataset.alert];$('#panel').hidden=true;if(a&&a.go!=null)go(a.go,true);return}
  if(t.id==='pp'){S.paused=!S.paused;lastRoll=Date.now();return renderTabs()}

});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;const pos=e.target.selectionStart;renderScene(true);const q=$('#q');if(q){q.focus();q.setSelectionRange(pos,pos)}}});
addEventListener('keydown',e=>{if(/input|textarea/i.test(e.target.tagName))return;if(e.key==='ArrowRight')go(S.scene+1,true);if(e.key==='ArrowLeft')go(S.scene-1,true)});
const tipx=$('#tipx');
document.addEventListener('mousemove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tipx.style.display='none';return}tipx.textContent=t.dataset.tip;tipx.style.display='block';const w=tipx.offsetWidth;tipx.style.left=Math.min(e.clientX+14,innerWidth-w-8)+'px';tipx.style.top=(e.clientY+16)+'px'});
document.addEventListener('mouseleave',()=>tipx.style.display='none');
document.addEventListener('mousemove',()=>{document.body.classList.add('show');clearTimeout(window._sh);window._sh=setTimeout(()=>document.body.classList.remove('show'),6000)});
addEventListener('resize',()=>{let p=null;try{p=localStorage.getItem('tv')}catch(e){}if(p==null){const w=wantTV();if(w!==isTV()){setTV(w,false);return}}fit()});

/* ---------- boot ---------- */
async function boot(){
  document.documentElement.classList.toggle('tv',wantTV());fit();tick();setInterval(tick,1000);setInterval(rollTick,500);setInterval(autoScroll,45);
  renderTabs();renderScene();renderTicker();renderWx();
  loadData();setInterval(loadData,60000);
  loadWx();setInterval(loadWx,10*60*1000);
  setInterval(()=>{renderTicker()},5*60*1000);
  setInterval(()=>{const d=todayStr();if(d!==S._day){S._day=d;renderScene(true)}},60000);S._day=todayStr();
}
boot();
})();
</script>
